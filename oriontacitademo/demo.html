<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pencatatan Data - Standar Industri Hijau Minyak Goreng Sawit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f7fbf8; }
        input:disabled { background-color: #f3f4f6; cursor: not-allowed; color: #9ca3af; }
    </style>
</head>
<body class="text-gray-900 antialiased">

    <!-- Navigasi -->
    <nav class="bg-white border-b border-gray-100 py-4 px-6 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="bg-emerald-800 text-white px-3 py-2 rounded-lg font-extrabold text-sm tracking-wider">ORION NODE GREEN</div>
        </div>
    </nav>

    <!-- Konten Utama -->
    <div class="container mx-auto px-6 py-10">
        <div class="max-w-5xl mx-auto">
            <h1 class="text-3xl font-extrabold text-gray-800 mb-2">Pencatatan Data Industri Minyak Goreng Sawit</h1>
            <p class="text-gray-600 text-sm mb-8">Formulir input mandiri berdasarkan struktur Standar Industri Hijau (Mode Demo).</p>

            <!-- Card Form Input -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 mb-10">
                <form id="inputForm" class="space-y-6">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Nama Perusahaan / Pabrik</label>
                            <input type="text" name="companyName" value="PT Sawit Mandiri (Demo)" disabled class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-bold text-gray-700 mb-2">Email Perusahaan <span class="text-emerald-600">(Dapat Diisi)</span></label>
                            <input type="email" name="companyEmail" placeholder="Contoh: info@sawitmandiri.co.id" class="w-full px-4 py-3 rounded-xl border border-2 border-emerald-500 focus:outline-none focus:border-emerald-700 text-sm bg-white">
                        </div>
                    </div>

                    <!-- Input Nama dengan variabel nameVal -->
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Pengguna (Dapat Diisi)</label>
                        <input type="text" name="nameVal" placeholder="Masukkan nama (minimal 3 karakter)" class="w-full px-4 py-3 rounded-xl border border-gray-200 focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>

                    <!-- 1. Bahan Baku & Penolong -->
                    <div class="border-t pt-4">
                        <h3 class="font-bold text-emerald-800 mb-3 text-sm">1. Bahan Baku & Bahan Penolong</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Rasio Produk (Max 58/100)</label>
                                <input type="text" name="rasioProduk" value="58/100 (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">H3PO4 (Max 0.60 kg/ton)</label>
                                <input type="text" name="h3po4" value="0.55 kg/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Bleaching Earth (Max 14.00 kg/ton)</label>
                                <input type="text" name="bleachingEarth" value="12.00 kg/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 2. Energi & Air -->
                    <div class="border-t pt-4">
                        <h3 class="font-bold text-emerald-800 mb-3 text-sm">2. Konsumsi Energi & Air</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Listrik Refinery (Max 0.60 GJ/ton)</label>
                                <input type="text" name="refineryEnergy" value="0.50 GJ/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Listrik Filling (Max 15.50 kWh/ton)</label>
                                <input type="text" name="fillingEnergy" value="14.00 kWh/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Fresh Water / Air (Max 0.27 m3/ton)</label>
                                <input type="text" name="freshWater" value="0.25 m3/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 3. Proses Produksi -->
                    <div class="border-t pt-4">
                        <h3 class="font-bold text-emerald-800 mb-3 text-sm">3. Proses Produksi (Efisiensi)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Refinery (Min 85/100)</label>
                                <input type="text" name="prosesRefinery" value="88/100 (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Fraksinasi (Min 85/100)</label>
                                <input type="text" name="prosesFraksinasi" value="86/100 (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                        </div>
                    </div>

                    <!-- 4. Emisi Gas Rumah Kaca (GRK) -->
                    <div class="border-t pt-4">
                        <h3 class="font-bold text-emerald-800 mb-3 text-sm">4. Emisi Gas Rumah Kaca (Total Emissions)</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Total Emisi Refinery (Max 0.07)</label>
                                <input type="text" name="emisiRefinery" value="0.06 CO2eq/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Total Emisi Fraksinasi (Max 0.03)</label>
                                <input type="text" name="emisiFraksinasi" value="0.02 CO2eq/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-600 mb-1">Total Emisi Filling (Max 0.02)</label>
                                <input type="text" name="emisiFilling" value="0.01 CO2eq/ton (Default)" disabled class="w-full px-3 py-2 rounded-lg border text-sm">
                            </div>
                        </div>
                    </div>

                    <div class="pt-4">
                        <button type="submit" formnovalidate class="w-full bg-[#107c41] hover:bg-emerald-700 text-white font-bold py-3.5 rounded-xl shadow-md transition">
                            Hasil penilaian asesmen
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('inputForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const nameInput = document.querySelector('input[name="nameVal"]');
            const emailInput = document.querySelector('input[name="companyEmail"]');

            const nameVal = nameInput.value.trim();
            const emailVal = emailInput.value.trim();

            // Validasi Nama Kosong & Minimal 3 Karakter
            if (!nameVal) {
                alert(' Peringatan:\nKolom nama tidak boleh kosong!');
                nameInput.focus();
                return;
            }
            if (nameVal.length < 3) {
                alert(' Peringatan:\nNama harus terdiri dari minimal 3 karakter!');
                nameInput.focus();
                return;
            }

            // Validasi Email Kosong
            if (!emailVal) {
                alert(' Peringatan:\nKolom email perusahaan tidak boleh kosong!');
                emailInput.focus();
                return;
            }

            // Validasi Format Email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(emailVal)) {
                alert('Format Salah:\nPenulisan alamat email tidak valid (contoh: nama@domain.com)');
                emailInput.focus();
                return;
            }

            // Kirim data ke backend lokal (/api/assessments)
            fetch('/api/assessments', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    companyEmail: emailVal,
                    nameVal: nameVal 
                })
            })
            .then(async res => {
    const response = await res.json();

    if (res.ok) {
        // Tampilkan pesan sukses yang rapi dan elegan
        alert('✅ Berhasil!\nAsesmen berhasil diproses dan dikirim ke email: ' + emailVal);
        this.reset();
    } else {
        let errorMsg = response.message;
        try {
            const parsed = JSON.parse(response.message);
            if (parsed.error) errorMsg = parsed.error;
        } catch (err) {}

        alert('❌ Gagal (Code ' + res.status + '):\n' + errorMsg);
    }
})
.catch(err => {
    alert('Terjadi kesalahan jaringan ke server lokal.');
});
            });
        
    </script>
</body>
</html>
